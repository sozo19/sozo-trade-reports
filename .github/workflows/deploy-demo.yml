name: Déploiement de la démo Barbershop Mont-Blanc

# Publie le dossier barbershop-mont-blanc/ sur GitHub Pages.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
    paths:
      - 'barbershop-mont-blanc/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Envoi du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./barbershop-mont-blanc

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
