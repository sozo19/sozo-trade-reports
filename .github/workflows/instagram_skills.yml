name: Instagram Saves vers Compétences

on:
  schedule:
    - cron: '30 6,18 * * *'   # 2x/jour (UTC) : matin et soir
  workflow_dispatch:           # lancement manuel possible

permissions:
  contents: write

concurrency:
  group: instagram-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: instagram_sync/requirements.txt

    - name: Install dependencies
      run: pip install -r instagram_sync/requirements.txt

    - name: Sync Instagram saves
      env:
        IG_USERNAME: ${{ secrets.IG_USERNAME }}
        IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        IG_CSRFTOKEN: ${{ secrets.IG_CSRFTOKEN }}
        IG_MID: ${{ secrets.IG_MID }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      run: python instagram_sync/sync_saves.py

    - name: Commit new skills and notes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add knowledge .claude/skills instagram_sync/state.json 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "sync: nouvelles compétences depuis les saves Instagram ($(date -u +%F))"
          git push
        else
          echo "Rien de nouveau à committer."
        fi
